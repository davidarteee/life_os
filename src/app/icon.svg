<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LifeOS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a26"/>
      <stop offset="1" stop-color="#070910"/>
    </linearGradient>
    <radialGradient id="star" cx="50%" cy="44%" r="62%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#c3cdf5"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g filter="url(#glow)">
    <path
      d="M256 56
         C 274 176, 336 238, 456 256
         C 336 274, 274 336, 256 456
         C 238 336, 176 274, 56 256
         C 176 238, 238 176, 256 56 Z"
